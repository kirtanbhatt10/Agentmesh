[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentmesh"
version = "0.2.0"
description = "AgentMesh: an open protocol for peer-to-peer AI agent communication, with schemas, validators and a dependency-light reference agent, registry and client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kirtan Bhatt", email = "kirtan11bhatt@gmail.com" }]
keywords = [
  "agents",
  "ai",
  "a2a",
  "agent-to-agent",
  "protocol",
  "json-schema",
  "multi-agent",
  "orchestration",
  "registry",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "twine>=5.0"]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/Agentmesh"
Repository = "https://github.com/kirtanbhatt10/Agentmesh"
Issues = "https://github.com/kirtanbhatt10/Agentmesh/issues"
Changelog = "https://github.com/kirtanbhatt10/Agentmesh/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kirtanbhatt10/Agentmesh/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmesh"]

[tool.hatch.build.targets.wheel.force-include]
"specs/manifest.schema.json" = "agentmesh/schemas/manifest.schema.json"
"specs/task.schema.json" = "agentmesh/schemas/task.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "specs/",
  "tests/",
  "examples/",
  "docs/",
  "scripts/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
